<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW2 2009 Zombie Menu - Vector Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080a08;
            --menu-text: #e1e1e1;
            --mw-yellow: #e5c100;
            --bar-bg: rgba(0, 0, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /*background-color: var(--bg-color);*/
            font-family: 'Rajdhani', sans-serif;
            color: var(--menu-text);
        }

        /* VECTOR ZOMBIE BACKGROUND */
        .vector-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
			background-repeat: no-repeat; 
            background:url('https://pekingduck4.github.io/3dnArt/Gemini_Generated_Image_6cemp76cemp76cem.png'); 
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }

        /* The SVG Zombie Art */


        @keyframes breathe {
            from { transform: translate(50px, 50px) scale(1); }
            to { transform: translate(30px, 30px) scale(1.02); }
        }

        /* SCANLINES & ATMOSPHERE */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 3px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.4;
        }

        /* MENU UI */
        .ui-wrapper {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%;
        }

        .header {
            margin-bottom: 40px;
            border-left: 4px solid var(--mw-yellow);
            padding-left: 20px;
        }

        .header h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 15px;
            text-transform: uppercase;
            font-weight: 700;
            line-height: 1;
        }

        .header p {
            margin: 5px 0 0 0;
            color: #e1e1e1;
            letter-spacing: 5px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav li {
            position: relative;
            width: 400px;
            margin-bottom: 3px;
            background: var(--bar-bg);
            cursor: pointer;
            transition: all 0.1s;
        }

        /* The Selection Slide Effect */
        nav li::before {
            content: '';
            position: absolute;
            left: -100px;
            top: 0;
            height: 100%;
            width: 0;
            background: #fff;
            transition: width 0.15s ease-out;
            z-index: -1;
        }

        nav li:hover::before {
            width: 500px;
        }

        nav li a {
            display: block;
            padding: 15px 25px;
            color: inherit;
            text-decoration: none;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav li:hover a {
            color: #000;
            font-weight: 700;
        }

        /* RANK INFO (TOP RIGHT) */
        .rank-card {
            position: absolute;
            top: 50px;
            right: 80px;
            text-align: right;
            z-index: 5;
        }
        .rank-label { color: #888; font-size: 1rem; letter-spacing: 2px; }
        .rank-num { font-size: 3rem; font-weight: 700; display: block; margin-top: -5px; }

    </style>
</head>
<body>

    <div class="vignette"></div>
    <div class="scanlines"></div>

    <!-- VECTOR BACKGROUND START -->
    <div class="vector-bg">
        <!-- SVG Zombie Silhouette Illustration -->

    </div>
    <!-- VECTOR BACKGROUND END -->

    <div class="rank-card">
        <span class="rank-label">PRESTIGE 10</span>
        <span class="rank-num">70</span>
    </div>

    <div class="ui-wrapper">
        <div class="header">
            <h1>ZOMBIES</h1>
            <p>Infestation Unit // Toasterino-09</p>
        </div>

        <nav>
            <ul>
                <li><a href="#">Resume Game</a></li>
                <li><a href="#">Single Player</a></li>
                <li><a href="#">Splitscreen</a></li>
                <li><a href="#">Online Co-op</a></li>
                <li><a href="#">Leaderboards</a></li>
                <li><a href="#">Options</a></li>
                <li><a href="#">Quit</a></li>
            </ul>
        </nav>
    </div>

    <script>
        // Retro click/hover sound effects (simulated)
        const items = document.querySelectorAll('li');
        items.forEach(item => {
            item.addEventListener('mouseenter', () => {
                const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-27.mp3');
                audio.volume = 0.1;
                audio.play();
            });
        });
    </script>
</body>
</html>
